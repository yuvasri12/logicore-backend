spring.application.name=logicore-oms

server.port=8080
spring.jpa.open-in-view=false

# Database. Dev defaults are for your laptop only; real values come from env vars.
spring.datasource.url=${LOGICORE_DB_URL:jdbc:postgresql://localhost:5432/logicore}
spring.datasource.username=${LOGICORE_DB_USER:postgres}
spring.datasource.password=${LOGICORE_DB_PASSWORD:admin}

# The database structure comes from Flyway scripts (src/main/resources/db/migration).
# Hibernate only checks that the entities match it, and never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# An existing database with no Flyway history is treated as already being at version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.messages.basename=messages
spring.messages.encoding=UTF-8
logging.pattern.level=%5p [%X{requestId}]
server.error.include-message=never

# Security. Dev defaults are for your laptop only; the prod profile removes them.
app.security.jwt.secret=${LOGICORE_JWT_SECRET:dev-only-secret-change-me-before-real-use-0123456789}
app.security.jwt.expiration-minutes=480

app.bootstrap.admin.email=${LOGICORE_ADMIN_EMAIL:yuvasris531@gmail.com}
app.bootstrap.admin.name=${LOGICORE_ADMIN_NAME:Yuvasri}
# No default password on purpose. Set LOGICORE_ADMIN_PASSWORD to create the admin and demo users.
# Without it the app still starts, but it creates no users (a warning is logged).
app.bootstrap.admin.password=${LOGICORE_ADMIN_PASSWORD:}
app.bootstrap.demo-users=${LOGICORE_DEMO_USERS:true}