# Used only with --spring.profiles.active=prod
# No defaults on purpose: the app will refuse to start if a value is missing.
spring.datasource.url=${LOGICORE_DB_URL}
spring.datasource.username=${LOGICORE_DB_USER}
spring.datasource.password=${LOGICORE_DB_PASSWORD}

app.security.jwt.secret=${LOGICORE_JWT_SECRET}
app.bootstrap.admin.email=${LOGICORE_ADMIN_EMAIL}
app.bootstrap.admin.name=${LOGICORE_ADMIN_NAME}
app.bootstrap.admin.password=${LOGICORE_ADMIN_PASSWORD}
app.bootstrap.demo-users=false

spring.jpa.show-sql=false